name: screenshots

# Runs the app in an iOS Simulator against the built-in pretend node and
# saves a screenshot of each screen, in light and dark mode.
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for rt, xs in d.items() if 'iOS' in rt for x in xs if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(phones[-1]['udid'])")
          xcrun simctl list devices | grep "$UDID"
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # A tidy status bar for the shots.
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
      - name: Light mode
        run: |
          xcrun simctl ui "$UDID" appearance light
          flutter drive --driver test_driver/integration_test.dart --target integration_test/screenshots_test.dart -d "$UDID" --dart-define=SHOT_PREFIX=light
      - name: Dark mode
        run: |
          xcrun simctl ui "$UDID" appearance dark
          flutter drive --driver test_driver/integration_test.dart --target integration_test/screenshots_test.dart -d "$UDID" --dart-define=SHOT_PREFIX=dark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: screenshots/
